events {
    worker_connections 1024;
}

http {
    # 1. Protección contra Headers Masivos / Buffer Bloat
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k; # Limita tamaño máximo de headers
    client_max_body_size 10M;          # Corta payloads > 10MB a nivel TCP/Nginx
    
    # Timeouts estrictos para evitar conexiones lentas colgadas (Slowloris/Headers)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;

    # 2. Rate Limiting a nivel Nginx (por IP)
    limit_req_zone $binary_remote_addr zone=fixed_limit:10m rate=30r/m;
    limit_req_status 429;

    upstream app_fixed_backend {
        server 127.0.0.1:5000;
    }

    server {
        listen 5001;

        # Aplicar el rate limiting con un pequeño burst
        limit_req zone=fixed_limit burst=10 nodelay;

        location / {
            proxy_pass http://app_fixed_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Corta la conexión rápido si la app no responde
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }
}